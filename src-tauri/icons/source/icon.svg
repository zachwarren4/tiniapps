<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="tiniapps icon">
  <defs>
    <linearGradient id="background" x1="190" y1="116" x2="834" y2="908" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2933"/>
      <stop offset="1" stop-color="#10151d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
