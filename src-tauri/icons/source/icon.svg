  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#background)"/>
  <rect x="151" y="151" width="722" height="722" rx="166" fill="none" stroke="#f4f0e8" stroke-opacity=".08" stroke-width="24"/>

  <g filter="url(#shadow)">
    <rect x="278" y="278" width="196" height="196" rx="46" fill="#f4f0e8"/>
    <rect x="550" y="278" width="196" height="196" rx="46" fill="#7ed6b2"/>
    <rect x="278" y="550" width="196" height="196" rx="46" fill="#c8d3df"/>
    <rect x="550" y="550" width="196" height="196" rx="46" fill="#f4f0e8"/>
  </g>

  <circle cx="512" cy="512" r="34" fill="#10151d" opacity=".55"/>
</svg>
